<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Concept C "Pulse": board columns with a live heartbeat line running across them. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#262B57"/>
      <stop offset="1" stop-color="#0D1022"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2BD4A4"/>
      <stop offset="0.5" stop-color="#4F7CFF"/>
      <stop offset="1" stop-color="#F5A524"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <g fill="#FFFFFF" fill-opacity="0.07">
    <rect x="20" y="24" width="24" height="80" rx="7"/>
    <rect x="52" y="24" width="24" height="80" rx="7"/>
    <rect x="84" y="24" width="24" height="80" rx="7"/>
  </g>
  <polyline points="12,70 36,70 46,46 58,94 70,34 80,70 116,70" fill="none" stroke="url(#line)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>
