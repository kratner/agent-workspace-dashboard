  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <rect x="20" y="24" width="88" height="24" rx="7" fill="#FFFFFF" fill-opacity="0.1" stroke="#F5A524" stroke-width="2.5"/>
