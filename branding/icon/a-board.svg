<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Concept A "Board": three Kanban columns; the single amber card is the session waiting on you. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#262B57"/>
      <stop offset="1" stop-color="#0D1022"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <g fill="#FFFFFF" fill-opacity="0.07">
    <rect x="20" y="24" width="24" height="80" rx="7"/>
    <rect x="52" y="24" width="24" height="80" rx="7"/>
    <rect x="84" y="24" width="24" height="80" rx="7"/>
  </g>
  <rect x="23" y="28" width="18" height="16" rx="4" fill="#F5A524" filter="url(#glow)" opacity="0.9"/>
  <rect x="23" y="28" width="18" height="16" rx="4" fill="#F5A524"/>
  <rect x="55" y="28" width="18" height="16" rx="4" fill="#4F7CFF"/>
  <rect x="55" y="48" width="18" height="16" rx="4" fill="#4F7CFF" fill-opacity="0.7"/>
  <rect x="87" y="28" width="18" height="16" rx="4" fill="#2BD4A4"/>
  <rect x="87" y="48" width="18" height="16" rx="4" fill="#2BD4A4" fill-opacity="0.7"/>
  <rect x="87" y="68" width="18" height="16" rx="4" fill="#2BD4A4" fill-opacity="0.45"/>
</svg>
