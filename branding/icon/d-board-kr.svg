<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Concept D "Board, KR colors": concept A in the GitHub KR palette (#FFF200 on black, tight
       corner radius like the avatar). Yellow is the only color: the waiting card. Working and
       idle cards are neutral grays (yellow tints over black turn olive). -->
  <defs>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>
  <rect x="2" y="2" width="124" height="124" rx="10" fill="#000000"/>
  <g fill="#1C1C1C">
    <rect x="18" y="22" width="26" height="84" rx="5"/>
    <rect x="51" y="22" width="26" height="84" rx="5"/>
    <rect x="84" y="22" width="26" height="84" rx="5"/>
  </g>
  <rect x="21" y="26" width="20" height="18" rx="3" fill="#FFF200" filter="url(#glow)" opacity="0.8"/>
  <rect x="21" y="26" width="20" height="18" rx="3" fill="#FFF200"/>
  <g fill="#8A8A8A">
    <rect x="54" y="26" width="20" height="18" rx="3"/>
    <rect x="54" y="48" width="20" height="18" rx="3"/>
  </g>
  <g fill="#454545">
    <rect x="87" y="26" width="20" height="18" rx="3"/>
    <rect x="87" y="48" width="20" height="18" rx="3"/>
    <rect x="87" y="70" width="20" height="18" rx="3"/>
  </g>
</svg>
